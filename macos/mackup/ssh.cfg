# Custom ssh app config for Mackup.
# Overrides the built-in ssh.cfg, which only syncs config + authorized_keys.
# Private keys are included so the SSH signing/authentication keys survive a
# machine reset. Passphrase-protected keys are safe to store encrypted in
# iCloud Drive.
[application]
name = SSH

[configuration_files]
.ssh/config
.ssh/authorized_keys
.ssh/id_ed25519
.ssh/id_ed25519.pub
.ssh/id_rsa
.ssh/id_rsa.pub
.ssh/id_ecdsa
.ssh/id_ecdsa.pub
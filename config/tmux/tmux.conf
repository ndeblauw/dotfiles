# Minimal tmux configuration, symlinked to ~/.config/tmux/tmux.conf by bin/install.
# Goal: sane defaults for Ghostty and the macOS clipboard, nothing clever.

# 1-based windows and panes, matching the number keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse selection, resizing and scrollback
set -g mouse on

# 24-bit colour. Ghostty advertises itself as xterm-ghostty, so name it explicitly
# and use a terminfo entry that exists on macOS.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Let applications notice focus changes, so vim and friends reload buffers
set -g focus-events on

# Copy to the system clipboard, vi keys in copy mode
set -g set-clipboard on
set -s copy-command "pbcopy"
setw -g mode-keys vi

# Long scrollback, and do not make vim or fzf wait on Escape
set -g history-limit 50000
set -sg escape-time 10

# Modest status bar
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%H:%M"
